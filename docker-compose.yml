version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: placement_attendance_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: placement_attendance_db
    ports:
      - "5432:5432"
      - "5433:5432" # Alternative mapping fallback if 5432 is occupied
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
